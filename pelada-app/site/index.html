<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Pelada Futebol Andaraí</title>
<link rel="icon" type="image/webp" href="logo.webp">
<style>
  :root {
    --fundo: #f3f5f1; --cartao: #ffffff; --texto: #17201a; --suave: #5d6b61; --linha: #dfe5dc;
    --verde: #166534; --verde-forte: #14532d; --verde-claro: #dcfce7; --sobre-verde: #ffffff;
    --alerta: #b45309; --alerta-fundo: #fef3c7; --erro: #b91c1c; --erro-fundo: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1512; --cartao: #18211c; --texto: #e8efe9; --suave: #9aa89e; --linha: #2a362f;
      --verde: #22a355; --verde-forte: #14532d; --verde-claro: #143222; --sobre-verde: #ffffff;
      --alerta: #fbbf24; --alerta-fundo: #3a2c0c; --erro: #fca5a5; --erro-fundo: #3f1717;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 0 16px 96px; }
  h1, h2, h3, p { margin: 0; }
  .topo { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; }
  .logo { width: 48px; height: 48px; border-radius: 50%; flex: none; }
  .logo-grande { width: 132px; height: 132px; border-radius: 50%; display: block; margin: 0 auto 16px; }
  .entrada h1, .entrada > .nota { text-align: center; }
  .topo h1 { font-size: 20px; }
  .topo small { color: var(--suave); display: block; }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .cartao h2 { font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cartao h2 span { color: var(--suave); font-weight: 500; font-size: 14px; white-space: nowrap; }
  .destaque { background: var(--verde-forte); color: var(--sobre-verde); border: 0; }
  .destaque .data { font-size: 22px; font-weight: 700; }
  .destaque .data::first-letter { text-transform: uppercase; }
  .destaque .hora { opacity: .85; margin-bottom: 12px; }
  .destaque .status { background: rgba(255,255,255,.12); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .nota { color: var(--suave); font-size: 14px; }
  .faixa { background: var(--alerta-fundo); color: var(--alerta); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  button, .botao { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--linha);
    background: var(--cartao); color: var(--texto); padding: 10px 14px; cursor: pointer; min-height: 44px; }
  button:disabled { opacity: .55; cursor: default; }
  .primario { background: var(--verde); color: var(--sobre-verde); border-color: transparent; }
  .destaque .primario { background: #ffffff; color: var(--verde-forte); }
  .destaque .secundario { background: transparent; color: #ffffff; border-color: rgba(255,255,255,.5); }
  .faixa .link { color: inherit; text-decoration: underline; padding: 0; font-weight: 600; }
  .largo { width: 100%; }
  .pequeno { min-height: 34px; padding: 4px 10px; font-size: 13px; font-weight: 500; }
  .link { background: none; border: 0; color: var(--verde); padding: 8px 0; min-height: 0; }
  ol.lista { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  ol.lista li { counter-increment: n; display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linha); }
  ol.lista li:first-child { border-top: 0; }
  ol.lista li::before { content: counter(n); width: 24px; text-align: right; color: var(--suave); font-variant-numeric: tabular-nums; font-size: 14px; }
  ol.lista .nome { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  ol.lista li.eu .nome { font-weight: 700; }
  .etiqueta { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--verde-claro); color: var(--verde); white-space: nowrap; }
  .etiqueta.cinza { background: var(--linha); color: var(--suave); }
  .etiqueta.ok { background: var(--verde-claro); color: var(--verde); }
  .etiqueta.pendente { background: var(--alerta-fundo); color: var(--alerta); }
  .vazio { color: var(--suave); font-size: 14px; padding: 4px 0; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--suave); }
  input, select { font: inherit; color: var(--texto); background: var(--fundo); border: 1px solid var(--linha);
    border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  .linha-admin { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--linha); }
  .linha-admin:first-of-type { border-top: 0; }
  .linha-admin .opcoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .linha-admin select { width: auto; min-height: 36px; padding: 4px 8px; }
  .marca { display: inline-flex; align-items: center; gap: 6px; color: var(--texto); font-size: 14px; }
  .marca input { width: 18px; height: 18px; min-height: 0; }
  .subabas { display: flex; gap: 8px; margin-bottom: 14px; }
  .subabas button { flex: 1; padding: 8px; min-height: 40px; font-size: 14px; }
  .subabas .ativa { background: var(--verde-claro); color: var(--verde); border-color: transparent; }
  .pix { display: flex; gap: 8px; align-items: center; background: var(--fundo); border-radius: 10px; padding: 10px 12px; margin: 8px 0 4px; }
  .pix code { flex: 1; overflow-wrap: anywhere; font-size: 15px; }
  nav.abas { position: fixed; left: 0; right: 0; bottom: 0; background: var(--cartao); border-top: 1px solid var(--linha);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
  nav.abas button { flex: 1; max-width: 186px; border: 0; border-radius: 0; background: none; color: var(--suave); min-height: 56px; }
  nav.abas .ativa { color: var(--verde); box-shadow: inset 0 3px 0 var(--verde); }
  .entrada { padding-top: 48px; }
  .entrada h1 { font-size: 26px; margin-bottom: 4px; }
  .entrada .nota { margin-bottom: 20px; }
  .carregando { text-align: center; color: var(--suave); padding: 64px 0; }
  #aviso { position: fixed; left: 16px; right: 16px; bottom: 76px; max-width: 528px; margin: 0 auto; padding: 12px 14px;
    border-radius: 10px; background: var(--texto); color: var(--fundo); font-size: 14px; display: none; z-index: 5; }
  #aviso.visivel { display: block; }
  #aviso.erro { background: var(--erro-fundo); color: var(--erro); border: 1px solid var(--erro); }
</style>
</head>
<body>
<div id="app"><p class="carregando">Carregando…</p></div>
<div id="aviso" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
